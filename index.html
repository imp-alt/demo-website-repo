<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello, world! | demo-website-repo</title>
    <!-- Inline data URI: keeps the page self-contained and stops the browser
         probing /favicon.ico, which would 404 on a bare Pages deploy. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' x='16' text-anchor='middle' font-size='26'%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --fg: #1b1f24;
        --muted: #4a5158;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, "Noto Sans", "Liberation Sans", sans-serif,
          "Apple Color Emoji", "Segoe UI Emoji";
        line-height: 1.55;
        padding: clamp(1.5rem, 5vw, 4rem);
      }

      main {
        width: 100%;
        max-width: 42rem;
        margin: 0 auto;
        text-align: center;
        overflow-wrap: break-word;
      }

      h1 {
        font-size: clamp(2.25rem, 8vw, 4.5rem);
        line-height: 1.1;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 0.6rem;
      }

      p {
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        color: var(--muted);
        margin: 0 auto;
        max-width: 34rem;
      }

      /* ------------------------------------------------------------------
         Grove layer (decoration only).

         The trees are inline SVG in the HTML below, so they render with
         JavaScript switched off and need no script, no build step and no
         animation. The layer is fixed to the viewport, clipped by overflow,
         ignores the pointer, and sits behind <main>; nothing here touches the
         box model of the heading or the paragraph.
         ------------------------------------------------------------------ */
      .grove {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .grove__tree {
        position: absolute;
        bottom: 0;
        height: auto;
        display: block;
      }

      .grove__tree--pine {
        left: clamp(0.25rem, 3vw, 4rem);
        width: clamp(3.5rem, 12vw, 9rem);
      }

      .grove__tree--rowan {
        right: clamp(0.25rem, 3vw, 4rem);
        width: clamp(4rem, 15vw, 12rem);
      }

      .grove__tree--fir {
        left: clamp(4.5rem, 18vw, 16rem);
        width: clamp(2.75rem, 9vw, 6.5rem);
      }

      .grove__tree--birch {
        right: clamp(4.5rem, 18vw, 16rem);
        width: clamp(3rem, 10vw, 7.5rem);
      }

      /* On a narrow viewport the four trees would crowd the text, so only the
         two outer silhouettes stay, tucked into the bottom corners. They are
         kept short enough to clear the paragraph, whose bottom sits about
         60vh down: 28% of 700px is 196px, so the 88px pine and 64px rowan
         cannot reach it. */
      @media (max-width: 40rem) {
        .grove__tree--fir,
        .grove__tree--birch {
          display: none;
        }

        .grove__tree--pine {
          width: clamp(2.5rem, 8vw, 3.25rem);
        }

        .grove__tree--rowan {
          width: clamp(2.75rem, 9vw, 3.75rem);
        }
      }

      /* ------------------------------------------------------------------
         Emoji orbit layer (progressive enhancement).

         The layer is created by assets/js/main.js and is hidden by default,
         so a browser without JavaScript renders exactly the page above.
         ------------------------------------------------------------------ */
      .orbit {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        visibility: hidden;
      }

      /* JS has taken over: show the layer. */
      .orbit[data-orbit] {
        visibility: visible;
      }

      .orbit__emoji {
        position: absolute;
        top: 0;
        left: 0;
        margin: 0;
        padding: 0;
        border: 0;
        font-size: clamp(1.25rem, 3vw, 2rem);
        line-height: 1;
        text-align: center;
        user-select: none;
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <div class="grove" aria-hidden="true" role="none">
      <svg
        class="grove__tree grove__tree--pine"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 100 170"
        aria-hidden="true"
        role="none"
      >
        <rect x="45" y="126" width="10" height="44" fill="#6b4a2f" />
        <path d="M50 6 82 62H18Z" fill="#2f6b45" />
        <path d="M50 42 89 102H11Z" fill="#397c51" />
        <path d="M50 80 96 144H4Z" fill="#438d5c" />
      </svg>
      <svg
        class="grove__tree grove__tree--rowan"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 140 150"
        aria-hidden="true"
        role="none"
      >
        <path
          d="M64 150h13v-56l17-22h-8l-13 17-2-42h-9l-3 42-12-15h-8l17 20z"
          fill="#7a5638"
        />
        <circle cx="70" cy="44" r="34" fill="#4d8f4a" />
        <circle cx="40" cy="58" r="24" fill="#5aa055" />
        <circle cx="101" cy="57" r="23" fill="#427f42" />
        <circle cx="72" cy="21" r="19" fill="#63ab5e" />
      </svg>
      <svg
        class="grove__tree grove__tree--fir"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 90 190"
        aria-hidden="true"
        role="none"
      >
        <rect x="41" y="152" width="8" height="38" fill="#5f4127" />
        <path d="M45 10 71 58H19Z" fill="#1f5740" />
        <path d="M45 40 77 94H13Z" fill="#26654a" />
        <path d="M45 74 84 132H6Z" fill="#2d7354" />
        <path d="M45 112 88 162H2Z" fill="#35815e" />
      </svg>
      <svg
        class="grove__tree grove__tree--birch"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 110 180"
        aria-hidden="true"
        role="none"
      >
        <rect x="50" y="86" width="11" height="94" fill="#e8e3d8" />
        <path
          d="M52 100h6M53 118h5M52 136h6M53 154h5"
          stroke="#8f8a7d"
          stroke-width="2"
        />
        <ellipse cx="56" cy="52" rx="44" ry="44" fill="#8ab95f" />
        <ellipse cx="34" cy="68" rx="24" ry="24" fill="#9cc771" />
        <ellipse cx="79" cy="66" rx="22" ry="22" fill="#7aa953" />
      </svg>
    </div>
    <main>
      <h1>Hello, world!</h1>
      <p>
        This is the first page of the demo website &mdash; one static HTML file,
        no build step, no dependencies.
      </p>
    </main>
    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
