<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello, world! | demo-website-repo</title>
    <!-- Inline data URI: keeps the page self-contained and stops the browser
         probing /favicon.ico, which would 404 on a bare Pages deploy. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' x='16' text-anchor='middle' font-size='26'%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --fg: #1b1f24;
        --muted: #4a5158;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, "Noto Sans", "Liberation Sans", sans-serif,
          "Apple Color Emoji", "Segoe UI Emoji";
        line-height: 1.55;
        padding: clamp(1.5rem, 5vw, 4rem);
      }

      main {
        width: 100%;
        max-width: 42rem;
        margin: 0 auto;
        text-align: center;
        overflow-wrap: break-word;
      }

      h1 {
        font-size: clamp(2.25rem, 8vw, 4.5rem);
        line-height: 1.1;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 0.6rem;
      }

      p {
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        color: var(--muted);
        margin: 0 auto;
        max-width: 34rem;
      }

      /* ------------------------------------------------------------------
         Emoji orbit layer (progressive enhancement).

         The layer is created by assets/js/main.js and is hidden by default,
         so a browser without JavaScript renders exactly the page above.
         ------------------------------------------------------------------ */
      .orbit {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        visibility: hidden;
      }

      /* JS has taken over: show the layer. */
      .orbit[data-orbit] {
        visibility: visible;
      }

      .orbit__emoji {
        position: absolute;
        top: 0;
        left: 0;
        margin: 0;
        padding: 0;
        border: 0;
        font-size: clamp(1.25rem, 3vw, 2rem);
        line-height: 1;
        text-align: center;
        user-select: none;
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, world!</h1>
      <p>
        This is the first page of the demo website &mdash; one static HTML file,
        no build step, no dependencies.
      </p>
    </main>
    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
